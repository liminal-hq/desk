<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/liminal-hq-design-system-6cba2760-aafe-4956-b98a-086ca9e6ecd3/tokens/fonts.css">
<link rel="stylesheet" href="_ds/liminal-hq-design-system-6cba2760-aafe-4956-b98a-086ca9e6ecd3/tokens/colours.css">
<link rel="stylesheet" href="_ds/liminal-hq-design-system-6cba2760-aafe-4956-b98a-086ca9e6ecd3/styles.css">
<script src="_ds/liminal-hq-design-system-6cba2760-aafe-4956-b98a-086ca9e6ecd3/_ds_bundle.js"></script>
</helmet>
<div style="height: 100%; display: flex; flex-direction: column; font-family: Inter, sans-serif; font-size: 11px; color: #e0e0e0; background: #111116;">
  <dc-import name="DeskMenuBar" menus="{{ menus }}" ops="{{ ops }}" hint-size="100%,18px"></dc-import>
  <dc-import name="DeskToolbar" items="{{ tools }}" hint-size="100%,26px"></dc-import>
  <dc-import name="DeskTabs" tabs="{{ tabs }}" on-new="{{ newDoc }}" hint-size="100%,22px"></dc-import>
  <div style="flex: 1; min-height: 0; display: flex;">
    <div style="width: 40px; flex-shrink: 0; background: #0c0c10; border-right: 1px solid #1f2230; padding: 6px; display: flex; flex-direction: column; gap: 6px; align-items: center;">
      <div style="width: 26px; height: 18px; background: {{ curColour }}; box-shadow: 0 0 0 1px #050507, 0 0 0 2px #ffaa40;"></div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2px; width: 28px;">
        <sc-for list="{{ swatches }}" as="s" hint-placeholder-count="16">
          <span onClick="{{ s.pick }}" title="{{ s.c }}" style="height: 12px; cursor: pointer; background: {{ s.c }}; box-shadow: {{ s.ring }};"></span>
        </sc-for>
      </div>
    </div>
    <div data-drop-app="{{ winId }}" style="flex: 1; min-width: 0; overflow: auto; background: #0b0a11; display: flex;">
      <sc-if value="{{ hasDoc }}" hint-placeholder-val="{{ true }}">
        <canvas ref="{{ canvasRef }}" width="{{ w }}" height="{{ h }}" onMouseDown="{{ down }}" onMouseMove="{{ hover }}" onMouseLeave="{{ leave }}" onContextMenu="{{ canvasCtx }}" style="margin: auto; flex-shrink: 0; image-rendering: pixelated; cursor: crosshair; box-shadow: 0 0 0 1px #262a37; width: {{ cw }}px; height: {{ ch }}px;"></canvas>
      </sc-if>
      <sc-if value="{{ noDoc }}" hint-placeholder-val="{{ false }}">
        <div style="margin: auto; display: flex; flex-direction: column; align-items: center; gap: 8px; color: #7c8796;"><span>No picture open.</span><div style="display: flex; gap: 6px;"><span onClick="{{ newDoc }}" style="padding: 3px 10px; background: #ffaa40; color: #0a0a0c; font-weight: 600; cursor: pointer;">New picture</span><span onClick="{{ openDoc }}" style="padding: 3px 10px; border: 1px solid #333847; cursor: pointer;">Open…</span></div></div>
      </sc-if>
    </div>
  </div>
  <div style="height: 18px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; flex-shrink: 0; border-top: 1px solid #1f2230; background: #0c0c10; color: #7c8796; font-size: 10px;">
    <span style="white-space: nowrap;">{{ statusLeft }}</span><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ statusRight }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  static TOOLS = [['pencil', '✎', 'Pencil', 'P'], ['line', '╱', 'Line', 'L'], ['rect', '▭', 'Rectangle', 'R'], ['fill', '◍', 'Fill', 'F'], ['picker', '⊙', 'Pick colour', 'I']];
  state = { active: 0, tool: 'pencil', colour: 9, zoom: 2, at: null, rev: 0, navN: null };
  docs = [];
  nextId = 1;
  canvasRef = (el) => { this.cv = el; this.draw(); };
  componentDidMount() {
    if (this.props.nav) this.take(this.props.nav); else this.newDoc();
    this.onMove = (e) => this.drag(e);
    this.onUp = () => this.end();
    this.onKey = (e) => this.key(e);
    document.addEventListener('mousemove', this.onMove);
    document.addEventListener('mouseup', this.onUp);
    document.addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() { document.removeEventListener('mousemove', this.onMove); document.removeEventListener('mouseup', this.onUp); document.removeEventListener('keydown', this.onKey); }
  componentDidUpdate() {
    if (this.props.nav && this.props.nav.n !== this.state.navN) this.take(this.props.nav);
    this.draw();
    const d = this.doc(), t = 'Paint' + (d ? ' · ' + d.name : '');
    if (t !== this._t) { this._t = t; this.props.ops.setTitle(this.props.winId, t); }
  }
  bump() { this.setState(s => ({ rev: s.rev + 1 })); }
  doc() { return this.docs[this.state.active] || null; }
  newDoc(w = 200, h = 120) { this.docs.push({ id: this.nextId++, path: null, name: 'UNTITLED.BMP', w, h, px: new Uint8Array(w * h), undo: [], redo: [], dirty: false }); this.setState({ active: this.docs.length - 1 }); this.bump(); }
  take(nav) { this.setState({ navN: nav.n }); (nav.paths || (nav.path ? [nav.path] : [])).forEach(p => this.openPath(p)); }
  openPath(p) {
    const ops = this.props.ops, st = ops.stat(p);
    if (!st || st.dir || ops.kind(st.n, false) !== 'image') return ops.toast('Paint opens pictures', (st ? st.n : p) + " isn't a picture.");
    const i = this.docs.findIndex(d => d.path === p); if (i >= 0) return this.setState({ active: i });
    const m = st.meta || {}, w = m.w || 120, h = m.h || 80;
    const px = new Uint8Array(w * h); if (m.pixels) px.set(m.pixels.subarray ? m.pixels.subarray(0, w * h) : m.pixels);
    if (!m.pixels) ops.toast('Opened as a new picture', 'Paint reads the pictures it saves. Saving writes over ' + st.n + '.');
    this.docs.push({ id: this.nextId++, path: p, name: st.n, w, h, px, undo: [], redo: [], dirty: false });
    this.setState({ active: this.docs.length - 1 }); this.bump();
  }
  openDoc() { this.props.ops.pick({ mode: 'open', title: 'Open a picture', dir: 'C:\\PAINT', types: [{ label: 'Pictures', ext: ['BMP', 'PCX'] }], places: ['C:\\PAINT', 'C:\\DESK\\WALLPAPR'] }).then(p => p && this.openPath(p)); }
  saveAs() {
    const ops = this.props.ops, d = this.doc(); if (!d) return;
    ops.pick({ mode: 'save', title: 'Save picture as', dir: d.path ? ops.parent(d.path) : 'C:\\PAINT', name: d.path ? d.name : 'PICTURE.BMP', types: [{ label: 'Pictures', ext: ['BMP'] }] }).then(p => {
      if (!p) return; ops.writePixels(p, d.px, d.w, d.h); d.path = p; d.name = ops.base(p); d.dirty = false; this.bump(); ops.toast('Saved ' + d.name, 'In ' + ops.parent(p) + '. Changes save as you draw.');
    });
  }
  closeDoc(i) { this.docs.splice(i, 1); this.setState(s => ({ active: Math.max(0, Math.min(this.docs.length - 1, s.active > i ? s.active - 1 : s.active)) })); this.bump(); }
  commit() { const d = this.doc(); if (!d) return; if (d.path) this.props.ops.writePixels(d.path, d.px, d.w, d.h); else d.dirty = true; this.bump(); }
  snap() { const d = this.doc(); d.undo.push(new Uint8Array(d.px)); if (d.undo.length > 30) d.undo.shift(); d.redo = []; }
  undo() { const d = this.doc(); if (!d || !d.undo.length) return; d.redo.push(new Uint8Array(d.px)); d.px = d.undo.pop(); this.commit(); }
  redo() { const d = this.doc(); if (!d || !d.redo.length) return; d.undo.push(new Uint8Array(d.px)); d.px = d.redo.pop(); this.commit(); }
  draw() {
    const d = this.doc(), el = this.cv; if (!d || !el) return;
    if (el.width !== d.w) el.width = d.w; if (el.height !== d.h) el.height = d.h;
    const ctx = el.getContext('2d'), img = ctx.createImageData(d.w, d.h), P = this.props.ops.pal16();
    const rgb = P.map(c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]);
    for (let i = 0; i < d.px.length; i++) { const c = rgb[d.px[i]]; img.data[i * 4] = c[0]; img.data[i * 4 + 1] = c[1]; img.data[i * 4 + 2] = c[2]; img.data[i * 4 + 3] = 255; }
    ctx.putImageData(img, 0, 0);
  }
  pt(e) { const d = this.doc(), r = this.cv.getBoundingClientRect(); return { x: Math.floor((e.clientX - r.left) / r.width * d.w), y: Math.floor((e.clientY - r.top) / r.height * d.h) }; }
  plot(d, x, y, c) { if (x >= 0 && y >= 0 && x < d.w && y < d.h) d.px[y * d.w + x] = c; }
  line(d, x0, y0, x1, y1, c) { const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let err = dx + dy; for (;;) { this.plot(d, x0, y0, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy) { err += dy; x0 += sx; } if (e2 <= dx) { err += dx; y0 += sy; } } }
  rect(d, x0, y0, x1, y1, c) { this.line(d, x0, y0, x1, y0, c); this.line(d, x1, y0, x1, y1, c); this.line(d, x1, y1, x0, y1, c); this.line(d, x0, y1, x0, y0, c); }
  fill(d, x, y, c) { const t = d.px[y * d.w + x]; if (t === c) return; const st = [[x, y]]; while (st.length) { const [px, py] = st.pop(); if (px < 0 || py < 0 || px >= d.w || py >= d.h || d.px[py * d.w + px] !== t) continue; d.px[py * d.w + px] = c; st.push([px + 1, py], [px - 1, py], [px, py + 1], [px, py - 1]); } }
  start(e) {
    if (e.button !== 0) return;
    const d = this.doc(); if (!d) return; const p = this.pt(e), t = this.state.tool, c = this.state.colour;
    if (t === 'picker') return this.setState({ colour: d.px[p.y * d.w + p.x], tool: this.lastTool || 'pencil' });
    this.snap();
    if (t === 'fill') { this.fill(d, p.x, p.y, c); return this.commit(); }
    this.stroke = { t, x: p.x, y: p.y, lx: p.x, ly: p.y, base: new Uint8Array(d.px) };
    if (t === 'pencil') this.plot(d, p.x, p.y, c);
    this.draw();
  }
  drag(e) {
    const s = this.stroke; if (!s || !this.cv) return; const d = this.doc(), p = this.pt(e), c = this.state.colour;
    if (s.t === 'pencil') { this.line(d, s.lx, s.ly, p.x, p.y, c); s.lx = p.x; s.ly = p.y; }
    else { d.px.set(s.base); (s.t === 'line' ? this.line : this.rect).call(this, d, s.x, s.y, p.x, p.y, c); }
    this.draw(); this.setState({ at: p });
  }
  end() { if (!this.stroke) return; this.stroke = null; this.commit(); }
  setTool(t) { if (t === 'picker') this.lastTool = this.state.tool; this.setState({ tool: t }); }
  key(e) {
    if (!this.props.focused || this.props.ops.busy()) return;
    const tag = e.target && e.target.tagName; if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    const ctrl = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
    let used = true;
    if (ctrl && k === 'z') this.undo();
    else if (ctrl && (k === 'y' || (e.shiftKey && k === 'z'))) this.redo();
    else if (ctrl && k === 'n') this.newDoc();
    else if (ctrl && k === 'o') this.openDoc();
    else if (ctrl && k === 's') { const d = this.doc(); if (d && d.path) this.props.ops.toast('Already saved', 'Paint saves as you draw.'); else this.saveAs(); }
    else if (ctrl && k === 'w') this.closeDoc(this.state.active);
    else if (ctrl && (k === '=' || k === '+')) this.setState(s => ({ zoom: Math.min(6, s.zoom + 1) }));
    else if (ctrl && k === '-') this.setState(s => ({ zoom: Math.max(1, s.zoom - 1) }));
    else if (!ctrl) { const t = Component.TOOLS.find(x => x[3].toLowerCase() === k); if (t) this.setTool(t[0]); else used = false; }
    else used = false;
    if (used) e.preventDefault();
  }
  renderVals() {
    const ops = this.props.ops; if (!ops) return { menus: [], tools: [], tabs: [], swatches: [] };
    const s = this.state, d = this.doc(), P = ops.pal16();
    const tools = [
      ...Component.TOOLS.map(([k, g, label, key]) => ({ glyph: g, title: label + ' (' + key + ')', on: s.tool === k, run: () => this.setTool(k) })), '|',
      { glyph: '↶', title: 'Undo (Ctrl+Z)', disabled: !d || !d.undo.length, run: () => this.undo() }, { glyph: '↷', title: 'Redo (Ctrl+Y)', disabled: !d || !d.redo.length, run: () => this.redo() }, '|',
      { glyph: '−', title: 'Zoom out', disabled: s.zoom <= 1, run: () => this.setState({ zoom: s.zoom - 1 }) }, { text: s.zoom + '×' }, { glyph: '+', title: 'Zoom in', disabled: s.zoom >= 6, run: () => this.setState({ zoom: s.zoom + 1 }) }, '~',
      { glyph: '▣', label: 'Wallpaper', disabled: !d, run: () => ops.useWallpaperPixels(d.px, d.w, d.h, d.name) },
    ];
    const clear = (c) => { this.snap(); d.px.fill(c); this.commit(); };
    return {
      ops, winId: this.props.winId,
      menus: [
        { label: 'File', items: () => [
          { label: 'New picture', hint: 'Ctrl+N', run: () => this.newDoc() }, { label: 'Open…', hint: 'Ctrl+O', run: () => this.openDoc() },
          { label: d && d.path ? 'Save a copy as…' : 'Save as…', hint: 'Ctrl+S', disabled: !d, run: () => this.saveAs() },
          { label: 'Use as wallpaper', sep: true, disabled: !d, run: () => ops.useWallpaperPixels(d.px, d.w, d.h, d.name) },
          { label: 'Show in Files', disabled: !d || !d.path, run: () => ops.reveal(d.path) },
          { label: 'Close tab', hint: 'Ctrl+W', sep: true, disabled: !d, run: () => this.closeDoc(s.active) }, { label: 'Close window', run: () => ops.closeWindow(this.props.winId) },
        ] },
        { label: 'Edit', items: () => [
          { label: 'Undo', hint: 'Ctrl+Z', disabled: !d || !d.undo.length, run: () => this.undo() }, { label: 'Redo', hint: 'Ctrl+Y', disabled: !d || !d.redo.length, run: () => this.redo() },
          { label: 'Fill with this colour', sep: true, disabled: !d, run: () => clear(s.colour) }, { label: 'Clear', disabled: !d, run: () => clear(0) },
        ] },
        { label: 'View', items: () => [1, 2, 3, 4, 6].map((z, i) => ({ label: z + '×', check: s.zoom === z, hint: i === 0 ? 'Ctrl+−' : i === 4 ? 'Ctrl++' : '', run: () => this.setState({ zoom: z }) })) },
        { label: 'Tools', items: () => Component.TOOLS.map(([k, , label, key]) => ({ label, hint: key, check: s.tool === k, run: () => this.setTool(k) })) },
        { label: 'Help', items: () => [{ label: 'About Paint', run: () => ops.about('paint') }] },
      ],
      tools,
      tabs: this.docs.map((x, i) => ({ label: x.name, kind: 'image', active: i === s.active, dirty: x.dirty && !x.path, pick: () => this.setState({ active: i }), close: () => this.closeDoc(i) })),
      newDoc: () => this.newDoc(), openDoc: () => this.openDoc(),
      hasDoc: !!d, noDoc: !d, w: d ? d.w : 1, h: d ? d.h : 1, cw: d ? d.w * s.zoom : 0, ch: d ? d.h * s.zoom : 0, canvasRef: this.canvasRef,
      down: (e) => this.start(e), hover: (e) => { if (d && !this.stroke) this.setState({ at: this.pt(e) }); }, leave: () => this.setState({ at: null }),
      canvasCtx: (e) => { const p = d && this.pt(e); ops.menu(e, [
        { label: 'Pick this colour', run: () => this.setState({ colour: d.px[p.y * d.w + p.x] }) },
        { label: 'Undo', hint: 'Ctrl+Z', sep: true, disabled: !d.undo.length, run: () => this.undo() }, { label: 'Redo', hint: 'Ctrl+Y', disabled: !d.redo.length, run: () => this.redo() },
        { label: 'Fill with this colour', sep: true, run: () => clear(s.colour) }, { label: 'Clear', run: () => clear(0) },
        { label: 'Use as wallpaper', sep: true, run: () => ops.useWallpaperPixels(d.px, d.w, d.h, d.name) },
      ]); },
      curColour: P[s.colour],
      swatches: P.map((c, i) => ({ c, ring: i === s.colour ? '0 0 0 1px #ffaa40' : '0 0 0 1px #050507', pick: () => this.setState({ colour: i }) })),
      statusLeft: (s.at ? s.at.x + ', ' + s.at.y + ' · ' : '') + (d ? d.w + ' × ' + d.h + ' · 16 colours · ' + s.zoom + '×' : ''),
      statusRight: d ? (d.path ? 'Saves as you draw · ' + d.path : 'Not saved yet. Save as… keeps it.') : '',
    };
  }
}
</script>
</body>
</html>
