<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/liminal-hq-design-system-6cba2760-aafe-4956-b98a-086ca9e6ecd3/tokens/fonts.css">
<link rel="stylesheet" href="_ds/liminal-hq-design-system-6cba2760-aafe-4956-b98a-086ca9e6ecd3/tokens/colours.css">
<link rel="stylesheet" href="_ds/liminal-hq-design-system-6cba2760-aafe-4956-b98a-086ca9e6ecd3/styles.css">
<script src="_ds/liminal-hq-design-system-6cba2760-aafe-4956-b98a-086ca9e6ecd3/_ds_bundle.js"></script>
</helmet>
<div style="height: 100%; display: flex; flex-direction: column; font-family: Inter, sans-serif; font-size: 11px; color: #e0e0e0; background: #111116;">
  <dc-import name="DeskMenuBar" menus="{{ menus }}" ops="{{ ops }}" hint-size="100%,18px"></dc-import>
  <div style="flex: 1; min-height: 0; display: flex;">
    <div onContextMenu="{{ ctx }}" style="flex: 1; min-width: 0; padding: 8px; display: flex; flex-direction: column; gap: 6px;">
      <div style="background: #050507; box-shadow: inset 1px 1px 0 #050507, inset -1px -1px 0 #333847; padding: 4px 8px; display: flex; flex-direction: column; align-items: flex-end; gap: 1px; flex-shrink: 0;">
        <span style="height: 12px; color: #7c8796; font-family: 'JetBrains Mono', monospace; font-size: 10px; white-space: nowrap; overflow: hidden; max-width: 100%;">{{ pending }}</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 18px; color: #fff; white-space: nowrap; overflow: hidden; max-width: 100%;">{{ disp }}</span>
      </div>
      <sc-if value="{{ isProg }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; flex-shrink: 0;">
          <sc-for list="{{ bases }}" as="b" hint-placeholder-count="4">
            <div onClick="{{ b.pick }}" style="display: grid; grid-template-columns: 30px 1fr; height: 15px; align-items: center; cursor: default; padding: 0 4px; background: {{ b.bg }};">
              <span style="font-size: 10px; color: {{ b.labelFg }};">{{ b.label }}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; text-align: right; white-space: nowrap; overflow: hidden; color: {{ b.fg }};">{{ b.v }}</span>
            </div>
          </sc-for>
        </div>
      </sc-if>
      <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: repeat({{ colsN }}, 1fr); grid-auto-rows: 1fr; gap: 3px;">
        <sc-for list="{{ keys }}" as="k" hint-placeholder-count="20">
          <span onClick="{{ k.press }}" style="display: flex; align-items: center; justify-content: center; cursor: default; font-size: {{ k.fs }}px; background: {{ k.bg }}; color: {{ k.fg }};" style-hover="filter: brightness(1.25);">{{ k.label }}</span>
        </sc-for>
      </div>
    </div>
    <sc-if value="{{ tape }}" hint-placeholder-val="{{ true }}">
      <div onContextMenu="{{ tapeCtx }}" style="width: 112px; flex-shrink: 0; background: #0c0c10; border-left: 1px solid #1f2230; display: flex; flex-direction: column;">
        <span style="padding: 6px 8px 4px; color: #7c8796; font-size: 10px; flex-shrink: 0;">History</span>
        <div style="flex: 1; overflow-y: auto; display: flex; flex-direction: column;">
          <sc-for list="{{ hist }}" as="h" hint-placeholder-count="0">
            <div onClick="{{ h.use }}" style="padding: 3px 8px; display: flex; flex-direction: column; align-items: flex-end; cursor: default; border-bottom: 1px solid #14161d;" style-hover="background: #14161d;">
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #7c8796; white-space: nowrap; overflow: hidden; max-width: 100%;">{{ h.expr }}</span>
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #fff; white-space: nowrap; overflow: hidden; max-width: 100%;">{{ h.res }}</span>
            </div>
          </sc-for>
          <sc-if value="{{ histEmpty }}" hint-placeholder-val="{{ true }}"><span style="padding: 8px; color: #5a6273; line-height: 14px;">Results land here. Click one to use it again.</span></sc-if>
        </div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { mode: 'std', base: 10, tape: true, hist: [], disp: '0', acc: null, op: null, fresh: true, pend: '' };
  componentDidMount() { this.onKey = (e) => this.key(e); document.addEventListener('keydown', this.onKey); }
  componentWillUnmount() { document.removeEventListener('keydown', this.onKey); }
  prog() { return this.state.mode === 'prog'; }
  val(s = this.state) { return this.prog() ? (parseInt(s.disp, s.base) | 0) : parseFloat(s.disp); }
  show(n) { if (this.prog()) { n = n | 0; const b = this.state.base; return b === 10 ? String(n) : (n >>> 0).toString(b).toUpperCase(); } return !isFinite(n) ? 'Not a number' : String(Math.round(n * 1e10) / 1e10).slice(0, 16); }
  run(a, b, o) {
    if (this.prog()) return ({ '+': a + b, '−': a - b, '×': Math.imul(a, b), '÷': b === 0 ? 0 : Math.trunc(a / b), MOD: b === 0 ? 0 : a % b, AND: a & b, OR: a | b, XOR: a ^ b, '<<': a << b, '>>': a >> b }[o] ?? b) | 0;
    return o === '+' ? a + b : o === '−' ? a - b : o === '×' ? a * b : o === '÷' ? (b === 0 ? NaN : a / b) : b;
  }
  press(k) {
    const prog = this.prog();
    this.setState(s => {
      let { disp, acc, op, fresh, pend, hist } = s;
      const digits = '0123456789ABCDEF'.slice(0, prog ? s.base : 10);
      const cur = () => prog ? (parseInt(disp, s.base) | 0) : parseFloat(disp);
      if (digits.includes(k)) { disp = fresh || disp === '0' ? k : (disp + k).slice(0, prog ? 32 : 16); fresh = false; }
      else if (k === '.' && !prog) { if (fresh) { disp = '0.'; fresh = false; } else if (!disp.includes('.')) disp += '.'; }
      else if (k === 'C') { disp = '0'; acc = null; op = null; fresh = true; pend = ''; }
      else if (k === 'CE') { disp = '0'; fresh = true; }
      else if (k === '⌫') { disp = disp.length > 1 ? disp.slice(0, -1) : '0'; }
      else if (k === '±') { disp = this.show(-cur()); }
      else if (k === 'NOT') { disp = this.show(~cur()); fresh = true; }
      else if (k === '%' && !prog) { disp = this.show(cur() / 100); fresh = true; }
      else if (k === '=') {
        if (op !== null && acc !== null) { const b = cur(), r = this.run(acc, b, op); const expr = this.show(acc) + ' ' + op + ' ' + this.show(b); disp = this.show(r); hist = [{ expr, res: disp, base: s.base, mode: s.mode }, ...hist].slice(0, 40); acc = null; op = null; pend = ''; }
        fresh = true;
      } else if (['+', '−', '×', '÷', 'MOD', 'AND', 'OR', 'XOR', '<<', '>>'].includes(k)) {
        const c = cur(); if (op !== null && acc !== null && !fresh) { acc = this.run(acc, c, op); disp = this.show(acc); } else acc = c;
        op = k; fresh = true; pend = this.show(acc) + ' ' + k;
      } else return null;
      return { disp, acc, op, fresh, pend, hist };
    });
  }
  setMode(mode) { const v = this.val(); this.setState({ mode, base: 10, acc: null, op: null, pend: '', fresh: true, disp: mode === 'prog' ? String(Math.trunc(v) | 0) : String(v) }); }
  setBase(b) { const v = this.val(); this.setState({ base: b, disp: b === 10 ? String(v) : (v >>> 0).toString(b).toUpperCase(), fresh: true }); }
  copy() { this.props.ops.clipText(this.state.disp, false); }
  paste() {
    const t = String(this.props.ops.getClipText() || '').trim().toUpperCase();
    const ok = this.prog() ? new RegExp('^-?[' + '0123456789ABCDEF'.slice(0, this.state.base) + ']+$').test(t) : /^-?\d*\.?\d+$/.test(t);
    if (!ok) return this.props.ops.toast("That isn't a number", 'The clipboard holds "' + t.slice(0, 24) + '".');
    this.setState({ disp: t, fresh: false });
  }
  key(e) {
    if (!this.props.focused || this.props.ops.busy()) return;
    const ctrl = e.ctrlKey || e.metaKey, k = e.key;
    if (ctrl && k.toLowerCase() === 'c') { e.preventDefault(); return this.copy(); }
    if (ctrl && k.toLowerCase() === 'v') { e.preventDefault(); return this.paste(); }
    if (ctrl) return;
    const map = { '*': '×', '/': '÷', '-': '−', '+': '+', Enter: '=', '=': '=', Backspace: '⌫', Escape: 'C', Delete: 'CE', '.': '.', '%': this.prog() ? 'MOD' : '%', '&': 'AND', '|': 'OR', '^': 'XOR', '~': 'NOT', '<': '<<', '>': '>>' };
    let key = /^[0-9]$/.test(k) ? k : map[k];
if (this.prog() && /^[cC]$/.test(k) && this.state.base === 16) { e.preventDefault(); return this.digitC(); }
    if (!key && this.prog() && /^[a-fA-F]$/.test(k) && this.state.base === 16) key = k.toUpperCase();
    if (key) { e.preventDefault(); this.press(key); }
  }
  renderVals() {
    const ops = this.props.ops; if (!ops) return { menus: [], keys: [], hist: [], bases: [] };
    const s = this.state, prog = this.prog();
    const stdKeys = ['C', '⌫', '%', '÷', '7', '8', '9', '×', '4', '5', '6', '−', '1', '2', '3', '+', '±', '0', '.', '='];
    const valid = '0123456789ABCDEF'.slice(0, prog ? s.base : 10);
    const list = prog ? ['AND', 'OR', 'XOR', 'NOT', 'C', 'A', 'B', '<<', '>>', '⌫', 'C·', 'D', '7', '8', '9', 'E', 'F', '4', '5', '6', 'MOD', '÷', '1', '2', '3', '×', '−', '+', '0', '='] : stdKeys;
    const keys = list.map(k0 => {
      const k = k0 === 'C·' ? 'C' : k0, isHexC = k0 === 'C·';
      const label = isHexC ? 'C' : k;
      const digit = /^[0-9A-F]$/.test(label) && (isHexC || k0 !== 'C');
      const enabled = !digit || valid.includes(label);
      const op = ['÷', '×', '−', '+', 'MOD', 'AND', 'OR', 'XOR', 'NOT', '<<', '>>'].includes(k), eq = k === '=', fn = (k === 'C' && !isHexC) || ['⌫', '%', '±'].includes(k);
      return { label, fs: label.length > 2 ? 9 : 12,
        bg: eq ? '#ffaa40' : op ? '#372612' : fn ? '#1b1e28' : '#14161d', fg: !enabled ? '#333847' : eq ? '#0a0a0c' : op ? '#ffaa40' : fn ? '#b4bfce' : '#e0e0e0',
        press: () => { if (!enabled) return; if (isHexC) return this.digitC(); this.press(k); } };
    });
    const v = this.val();
    const bases = [[16, 'HEX'], [10, 'DEC'], [8, 'OCT'], [2, 'BIN']].map(([b, label]) => ({ label, v: b === 10 ? String(v | 0) : ((v | 0) >>> 0).toString(b).toUpperCase().replace(b === 2 ? /(?=(\d{4})+$)/g : /$^/, b === 2 ? ' ' : ''), bg: s.base === b ? '#372612' : 'transparent', fg: s.base === b ? '#ffaa40' : '#b4bfce', labelFg: s.base === b ? '#ffaa40' : '#7c8796', pick: () => this.setBase(b) }));
    return {
      ops,
      menus: [
        { label: 'Edit', items: () => [{ label: 'Copy result', hint: 'Ctrl+C', run: () => this.copy() }, { label: 'Paste number', hint: 'Ctrl+V', run: () => this.paste() }, { label: 'Clear history', sep: true, disabled: !s.hist.length, run: () => this.setState({ hist: [] }) }] },
        { label: 'View', items: () => [{ label: 'Standard', check: !prog, run: () => this.setMode('std') }, { label: 'Programmer', check: prog, run: () => this.setMode('prog') }, { label: 'History tape', check: s.tape, sep: true, run: () => this.setState({ tape: !s.tape }) }] },
        { label: 'Help', items: () => [{ label: 'Keyboard', run: () => ops.toast('Calculator keys', 'Digits, + − * /, Enter for =, Backspace, Esc clears. Programmer: A–F, & | ^ ~ < >.') }, { label: 'About Calculator', sep: true, run: () => ops.about('calc') }] },
      ],
      isProg: prog, bases, keys, colsN: prog ? 5 : 4,
      disp: s.disp, pending: s.pend || (prog ? { 16: 'HEX', 10: 'DEC', 8: 'OCT', 2: 'BIN' }[s.base] + ' · 32-bit' : ''),
      tape: s.tape, histEmpty: !s.hist.length,
      hist: s.hist.map(h => ({ expr: h.expr + ' =', res: h.res, use: () => this.setState(st => ({ disp: h.mode === st.mode && h.base === st.base ? h.res : st.disp, fresh: false })) })),
      ctx: (e) => ops.menu(e, [{ label: 'Copy result', run: () => this.copy() }, { label: 'Paste number', run: () => this.paste() }, { label: prog ? 'Standard' : 'Programmer', sep: true, run: () => this.setMode(prog ? 'std' : 'prog') }, { label: 'Clear', run: () => this.press('C') }]),
      tapeCtx: (e) => ops.menu(e, [{ label: 'Copy last result', disabled: !s.hist.length, run: () => ops.clipText(s.hist[0].res, false) }, { label: 'Clear history', disabled: !s.hist.length, run: () => this.setState({ hist: [] }) }, { label: 'Hide history', sep: true, run: () => this.setState({ tape: false }) }]),
    };
  }
  digitC() { this.setState(s => ({ disp: s.fresh || s.disp === '0' ? 'C' : (s.disp + 'C').slice(0, 32), fresh: false })); }
}
</script>
</body>
</html>
