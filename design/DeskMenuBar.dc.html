<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/liminal-hq-design-system-6cba2760-aafe-4956-b98a-086ca9e6ecd3/tokens/fonts.css">
<link rel="stylesheet" href="_ds/liminal-hq-design-system-6cba2760-aafe-4956-b98a-086ca9e6ecd3/tokens/colours.css">
<link rel="stylesheet" href="_ds/liminal-hq-design-system-6cba2760-aafe-4956-b98a-086ca9e6ecd3/styles.css">
<script src="_ds/liminal-hq-design-system-6cba2760-aafe-4956-b98a-086ca9e6ecd3/_ds_bundle.js"></script>
</helmet>
<div style="height: 18px; display: flex; align-items: center; padding: 0 4px; flex-shrink: 0; background: #0c0c10; border-bottom: 1px solid #1f2230; font-family: Inter, sans-serif; font-size: 11px; color: #e0e0e0;">
  <sc-for list="{{ menus }}" as="m" hint-placeholder-count="4">
    <span onMouseDown="{{ m.open }}" style="padding: 1px 8px; cursor: default; white-space: nowrap;" style-hover="background: #1b1e28; color: #fff;">{{ m.label }}</span>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 320, &quot;height&quot;: 18}, &quot;menus&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;{label: string, items: MenuItem[] | (() =&gt; MenuItem[])}[]&quot;}, &quot;ops&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;DeskOps&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const ops = this.props.ops;
    const menus = (this.props.menus || []).map(m => ({
      label: m.label,
      open: (e) => {
        const r = e.currentTarget.getBoundingClientRect();
        e.preventDefault(); e.stopPropagation();
        if (ops) ops.menu({ clientX: r.left, clientY: r.bottom, preventDefault() {}, stopPropagation() {} }, typeof m.items === 'function' ? m.items() : m.items);
      },
    }));
    return { menus };
  }
}
</script>
</body>
</html>
