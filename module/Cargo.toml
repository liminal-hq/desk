# The module loader's crates (docs/LOADER.md): the format crate `desk-module`, shared by the loaders and the packer, the host packer
# `dmdpack`, and those that follow them.
#
# The library crates that run in the core (`desk-module` and the loaders) are `no_std` + `alloc` and build for three places: the host,
# where `cargo test` runs the host tests; the native kernel's target (`kernel/i486-desk-none.json`); and the pure-Rust DOS target
# (`spikes/d0-rust-dos/dos-elf.json`). The cross builds take `--target` and `-Zbuild-std` on the command line, so the default target
# stays the host's. `dmdpack` is `std`, runs on the host only and is not built for those targets. `mods/` and `dos/` have their own
# workspaces, because their default target is not the host's.
[workspace]
members = ["format", "pack"]
exclude = ["mods", "dos"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false
