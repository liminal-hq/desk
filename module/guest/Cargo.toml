[package]
name = "desk-guest"
description = "The app side of the module loader: import slots, the entry points, logging and the panic handler"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The panic handler is a lang item, so a host test or doctest that links `std` would define it twice.
doctest = false

[features]
default = ["panic-handler"]
# The `#[panic_handler]` that sends the message to the core's `desk_panic`. A module that wants its own turns it off.
panic-handler = []
