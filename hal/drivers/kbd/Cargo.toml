[package]
name = "desk-kbd"
description = "The scancode set 1 decoder and the US key map, written once against the HAL"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
desk-hal.workspace = true

[features]
# Only for host builds; see `desk-hal`.
std = ["desk-hal/std"]

[dev-dependencies]
desk-hal = { workspace = true, features = ["std"] }
