[package]
name = "desk-shell"
description = "The shell itself: input events and the scenario format that scripts them, so the same steps run on the host and on both tracks"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
desk-hal.workspace = true
desk-gfx = { path = "../gfx" }
desk-ui = { path = "../ui" }
desk-kbd = { path = "../../hal/drivers/kbd" }

[features]
std = ["desk-hal/std", "desk-gfx/std", "desk-ui/std", "desk-kbd/std"]
