      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-shelldos
          path: dist/ci/results/
          if-no-files-found: warn
          # A re-run of the job uploads the same name again; without this it fails.
          overwrite: true
          retention-days: 7

  native:
    name: Native boot in QEMU
    needs: scope
    if: contains(needs.scope.outputs.groups, ',native,')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ghcr.io/liminal-hq/ci-dos@sha256:6b8c6308baaa4d05ee0f1af25512bece544ef79bbe653c31c7b5cab54ff52e2a
    env:
      CHECK_GROUPS: native
      TITLE: Native boot in QEMU
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # QEMU, NASM and mtools are in the image; setup confirms the Rust toolchain.
      - name: Set up the toolchain
        run: tools/setup.sh
      - name: tools/check.sh --groups native
        id: check
        run: |
          mkdir -p dist/ci
          CHECK_TIMES=dist/ci/check.times tools/check.sh --groups "$CHECK_GROUPS" 2>&1 | tee dist/ci/check.log
      - name: Keep the QEMU screendumps for the comparison
        run: tar -cf dist/ci/frames-native.tar dist/shell-native-8 dist/shell-native-4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frames-native
          path: dist/ci/frames-native.tar
          if-no-files-found: error
          # A re-run of the job uploads the same name again; without this it fails.
          overwrite: true
          retention-days: 3
      # The step table for the job summary, and the JUnit that publish-test-results.yml posts on the pull request: one test case per step
      # of tools/check.sh (tools/steps-junit, built here from the checkout) and cargo-nextest's report of each workspace that ran
      # host tests. The nextest files are copied first, so a converter that fails to build does not lose them.
      - name: Step report
        if: always()
        run: |
          mkdir -p dist/ci/results
          for ws in hal shell module tools/steps-junit; do
            if [ -f "$ws/target/nextest/ci/junit.xml" ]; then cp "$ws/target/nextest/ci/junit.xml" "dist/ci/results/nextest-${ws//\//-}.xml"; fi
          done
          cargo build --release --locked --quiet --manifest-path tools/steps-junit/Cargo.toml
          tools/steps-junit/target/release/steps-junit --times dist/ci/check.times --log dist/ci/check.log \
            --suite "$TITLE" --junit dist/ci/results/steps.xml --summary >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-native
          path: dist/ci/results/
          if-no-files-found: warn
          # A re-run of the job uploads the same name again; without this it fails.
          overwrite: true
          retention-days: 7

  compare:
    name: Both tracks compared
    # Runs only when both tracks passed (the implicit success() of a job's needs); the scope always selects shelldos and
    # native with compare.
    needs: [scope, shelldos, native]
    if: contains(needs.scope.outputs.groups, ',compare,')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container: ghcr.io/liminal-hq/ci-dos@sha256:6b8c6308baaa4d05ee0f1af25512bece544ef79bbe653c31c7b5cab54ff52e2a
    env:
      CHECK_GROUPS: compare
      TITLE: Both tracks compared
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frames-dos
          path: dist/ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frames-native
          path: dist/ci
      - name: Unpack the frames
        run: |
          tar -xf dist/ci/frames-dos.tar
          tar -xf dist/ci/frames-native.tar
          find dist -maxdepth 2 -type d | sort
      - name: tools/check.sh --groups compare
        id: check
        run: CHECK_TIMES=dist/ci/check.times tools/check.sh --groups "$CHECK_GROUPS" 2>&1 | tee dist/ci/check.log
      # The step table for the job summary, and the JUnit that publish-test-results.yml posts on the pull request: one test case per step
      # of tools/check.sh (tools/steps-junit, built here from the checkout) and cargo-nextest's report of each workspace that ran
      # host tests. The nextest files are copied first, so a converter that fails to build does not lose them.
      - name: Step report
        if: always()
        run: |
          mkdir -p dist/ci/results
          for ws in hal shell module tools/steps-junit; do
            if [ -f "$ws/target/nextest/ci/junit.xml" ]; then cp "$ws/target/nextest/ci/junit.xml" "dist/ci/results/nextest-${ws//\//-}.xml"; fi
          done
          cargo build --release --locked --quiet --manifest-path tools/steps-junit/Cargo.toml
          tools/steps-junit/target/release/steps-junit --times dist/ci/check.times --log dist/ci/check.log \
            --suite "$TITLE" --junit dist/ci/results/steps.xml --summary >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-compare
          path: dist/ci/results/
          if-no-files-found: warn
          # A re-run of the job uploads the same name again; without this it fails.
          overwrite: true
          retention-days: 7

  # The one status to require, named "CI passed". (The single job of the old workflow was named "check"; that status no longer
  # exists, so a branch protection rule that names it must be changed.) A job skipped by the scope counts as passing for a required status, so this job runs always() and
  # decides itself: a group job the scope did not select is skipped, which is fine; but when `scope` did not succeed its dependants
  # are skipped too, and then a skip is a failure. Runs on the runner's own bash and jq, not in the pinned image.
  ci-passed:
    name: CI passed
    needs: [scope, base, report, fonts, rust, dos, stdstubs, shelldos, native, compare]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Every job passed or was legitimately skipped
        run: |
          scope=$(jq -r '.scope.result' <<< "$NEEDS")
          bad=0
          {
            echo "## CI passed"
            echo "| Job | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r job result; do
            echo "| $job | $result |" >> "$GITHUB_STEP_SUMMARY"
            case "$result" in
              success) ;;
              skipped) if [ "$scope" != success ]; then echo "::error::$job was skipped because scope did not succeed"; bad=1; fi ;;
              *) echo "::error::$job: $result"; bad=1 ;;
            esac
          done < <(jq -r 'to_entries[] | [.key, .value.result] | @tsv' <<< "$NEEDS")
          exit "$bad"
