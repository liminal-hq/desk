# Runs tools/check.sh one group per job, so a pull request's checks list names what passed or failed. A first job chooses the groups
# a change can affect (tools/ci-scope.sh; a push to main or a manual run takes them all); then the licence headers and docs, the
# progress report, the fonts, the Rust workspaces, the DOS programs and spikes, the e-std-stubs spike, the shell on DOS, the native
# boot test under QEMU, and the two tracks' frames compared from the artefacts of the last two. A last job, "CI passed", gathers the
# results of all the others and is the one status to require.
#
# Every job writes its log and step times to dist/ci/ (check.log, check.times), turns them into JUnit with tools/steps-junit and uploads
# that, with cargo-nextest's JUnit where the job ran host tests, as a results-<job> artefact; the scope job uploads the event file.
# publish-test-results.yml posts them on the pull request once this run has finished.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

name: CI

on:
  # Every base branch, so each pull request of a stack gets its checks against the branch below it.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only a pull request's superseded run is cancelled; a push to main or a manual run finishes, so main always has a full result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # bash -e -o pipefail, so `tools/check.sh ... | tee` fails when the check does.
    shell: bash

jobs:
  scope:
    name: Choose check groups
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.scope.outputs.groups }}
    steps:
      # The whole history, so the merge base with the pull request's base branch is known.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A pull request runs the groups its changed paths can affect, measured from its own base branch (for a stacked pull request,
      # the branch below it). Every other run runs them all. A table that fails its self-test selects every group, with a warning,
      # and the base job's "CI scope table" step fails with the reason, so the table's fault is one red row and nothing else is skipped.
      - name: Choose the check groups
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          : > scope.txt
          if [ "$EVENT" != pull_request ]; then
            groups=all
            echo "ci-scope: a $EVENT run runs every group" > scope.txt
          elif ! tools/ci-scope.sh --self-test > /dev/null 2>&1; then
            groups=all
            echo "::warning::tools/ci-scope.sh --self-test failed, so every group runs; the base job's CI scope table step says why"
            echo "ci-scope: the self-test failed, so every group runs" > scope.txt
          else
            groups="$(tools/ci-scope.sh --base "origin/$BASE_REF" 2> scope.txt)"
          fi
          if [ "$groups" = all ]; then groups="$(tools/check.sh --names | paste -sd, -)"; fi
          echo "groups=,${groups}," >> "$GITHUB_OUTPUT"
          {
            echo "## Choose check groups"
            echo "- Groups: \`${groups}\`"
            echo
            echo "<details><summary>Why, path by path</summary>"
            echo
            echo '```text'
            cat scope.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      # Read by publish-test-results.yml. A pull request's own token is read-only for fork and Dependabot pull requests, so the results
      # are published from a workflow_run workflow, which runs with this repository's permissions; it reads this file only to choose
      # among pull requests GitHub already matched to the run. Uploaded from the job that always runs, so a skipped group never loses it.
      - name: Upload the event file
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: event-file
          path: ${{ github.event_path }}
          if-no-files-found: error
          # A re-run uploads the same name again; without this it fails.
          overwrite: true
          retention-days: 7

  base:
    name: Licence headers, docs and the scope table
    needs: scope
    if: contains(needs.scope.outputs.groups, ',base,')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The shared DOS build image from liminal-hq/.github (docker/ci/Dockerfile, target ci-dos), pinned by digest. Every job names the
    # same digest (a test checks it); updating it is a pull request whose checks run in the new image.
    container: ghcr.io/liminal-hq/ci-dos@sha256:6b8c6308baaa4d05ee0f1af25512bece544ef79bbe653c31c7b5cab54ff52e2a
    env:
      CHECK_GROUPS: base
      TITLE: Licence headers, docs and the scope table
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The checkout is owned by another user inside the container, and git refuses to list its files without this.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: tools/check.sh --groups base
        id: check
        run: |
          mkdir -p dist/ci
          CHECK_TIMES=dist/ci/check.times tools/check.sh --groups "$CHECK_GROUPS" 2>&1 | tee dist/ci/check.log
      # The step table for the job summary, and the JUnit that publish-test-results.yml posts on the pull request: one test case per step
      # of tools/check.sh (tools/steps-junit, built here from the checkout) and cargo-nextest's report of each workspace that ran
      # host tests. The nextest files are copied first, so a converter that fails to build does not lose them.
      - name: Step report
        if: always()
        run: |
          mkdir -p dist/ci/results
          for ws in hal shell module tools/steps-junit; do
            if [ -f "$ws/target/nextest/ci/junit.xml" ]; then cp "$ws/target/nextest/ci/junit.xml" "dist/ci/results/nextest-${ws//\//-}.xml"; fi
          done
          cargo build --release --locked --quiet --manifest-path tools/steps-junit/Cargo.toml
          tools/steps-junit/target/release/steps-junit --times dist/ci/check.times --log dist/ci/check.log \
            --suite "$TITLE" --junit dist/ci/results/steps.xml --summary >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-base
          path: dist/ci/results/
          if-no-files-found: warn
          # A re-run of the job uploads the same name again; without this it fails.
          overwrite: true
          retention-days: 7

  report:
    name: Progress report and frame tools
    needs: scope
    if: contains(needs.scope.outputs.groups, ',report,')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container: ghcr.io/liminal-hq/ci-dos@sha256:6b8c6308baaa4d05ee0f1af25512bece544ef79bbe653c31c7b5cab54ff52e2a
    env:
      CHECK_GROUPS: report
      TITLE: Progress report and frame tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: tools/check.sh --groups report
        id: check
        run: |
          mkdir -p dist/ci
          CHECK_TIMES=dist/ci/check.times tools/check.sh --groups "$CHECK_GROUPS" 2>&1 | tee dist/ci/check.log
      # The step table for the job summary, and the JUnit that publish-test-results.yml posts on the pull request: one test case per step
      # of tools/check.sh (tools/steps-junit, built here from the checkout) and cargo-nextest's report of each workspace that ran
      # host tests. The nextest files are copied first, so a converter that fails to build does not lose them.
      - name: Step report
        if: always()
        run: |
          mkdir -p dist/ci/results
          for ws in hal shell module tools/steps-junit; do
            if [ -f "$ws/target/nextest/ci/junit.xml" ]; then cp "$ws/target/nextest/ci/junit.xml" "dist/ci/results/nextest-${ws//\//-}.xml"; fi
          done
          cargo build --release --locked --quiet --manifest-path tools/steps-junit/Cargo.toml
          tools/steps-junit/target/release/steps-junit --times dist/ci/check.times --log dist/ci/check.log \
            --suite "$TITLE" --junit dist/ci/results/steps.xml --summary >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-report
          path: dist/ci/results/
          if-no-files-found: warn
          # A re-run of the job uploads the same name again; without this it fails.
          overwrite: true
          retention-days: 7

  fonts:
    name: Fonts
    needs: scope
    if: contains(needs.scope.outputs.groups, ',fonts,')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: ghcr.io/liminal-hq/ci-dos@sha256:6b8c6308baaa4d05ee0f1af25512bece544ef79bbe653c31c7b5cab54ff52e2a
    env:
      CHECK_GROUPS: fonts
      TITLE: Fonts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The font tools (opentype.js) come from the lockfile; the image carries Bun. With CI set, tools/check.sh fails rather than
      # skips without them.
      - name: Install the font tools
        run: bun install --frozen-lockfile
        working-directory: fonts
      - name: tools/check.sh --groups fonts
        id: check
        run: |
          mkdir -p dist/ci
          CHECK_TIMES=dist/ci/check.times tools/check.sh --groups "$CHECK_GROUPS" 2>&1 | tee dist/ci/check.log
      # The step table for the job summary, and the JUnit that publish-test-results.yml posts on the pull request: one test case per step
      # of tools/check.sh (tools/steps-junit, built here from the checkout) and cargo-nextest's report of each workspace that ran
      # host tests. The nextest files are copied first, so a converter that fails to build does not lose them.
      - name: Step report
        if: always()
        run: |
          mkdir -p dist/ci/results
          for ws in hal shell module tools/steps-junit; do
            if [ -f "$ws/target/nextest/ci/junit.xml" ]; then cp "$ws/target/nextest/ci/junit.xml" "dist/ci/results/nextest-${ws//\//-}.xml"; fi
          done
          cargo build --release --locked --quiet --manifest-path tools/steps-junit/Cargo.toml
          tools/steps-junit/target/release/steps-junit --times dist/ci/check.times --log dist/ci/check.log \
            --suite "$TITLE" --junit dist/ci/results/steps.xml --summary >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-fonts
          path: dist/ci/results/
          if-no-files-found: warn
          # A re-run of the job uploads the same name again; without this it fails.
          overwrite: true
          retention-days: 7

  rust:
    name: ${{ matrix.title }}
    needs: scope
    if: contains(needs.scope.outputs.groups, ',rust,')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: ghcr.io/liminal-hq/ci-dos@sha256:6b8c6308baaa4d05ee0f1af25512bece544ef79bbe653c31c7b5cab54ff52e2a
    strategy:
      fail-fast: false
      # Every part of the group (tools/check.sh --units) is in exactly one leg; a test checks it.
      matrix:
        include:
          - { key: hal, groups: "rust:hal", title: "Rust: HAL" }
          - { key: shell, groups: "rust:shell", title: "Rust: shell" }
          - { key: core, groups: "rust:core,rust:module,rust:tools,rust:spikes", title: "Rust: core, module, tools and spike lints" }
    env:
      CHECK_GROUPS: ${{ matrix.groups }}
      TITLE: ${{ matrix.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The image holds the pinned Rust toolchain with rust-src, clippy, rustfmt and cargo-nextest; setup confirms it and links vendor/.
      # Cargo downloads the crates that -Zbuild-std's sources depend on, so the job needs network access.
      - name: Set up the toolchain
        run: tools/setup.sh
      - name: tools/check.sh --groups ${{ matrix.groups }}
        id: check
        run: |
          mkdir -p dist/ci
          CHECK_TIMES=dist/ci/check.times tools/check.sh --groups "$CHECK_GROUPS" 2>&1 | tee dist/ci/check.log
      # The step table for the job summary, and the JUnit that publish-test-results.yml posts on the pull request: one test case per step
      # of tools/check.sh (tools/steps-junit, built here from the checkout) and cargo-nextest's report of each workspace that ran
      # host tests. The nextest files are copied first, so a converter that fails to build does not lose them.
      - name: Step report
        if: always()
        run: |
          mkdir -p dist/ci/results
          for ws in hal shell module tools/steps-junit; do
            if [ -f "$ws/target/nextest/ci/junit.xml" ]; then cp "$ws/target/nextest/ci/junit.xml" "dist/ci/results/nextest-${ws//\//-}.xml"; fi
          done
          cargo build --release --locked --quiet --manifest-path tools/steps-junit/Cargo.toml
          tools/steps-junit/target/release/steps-junit --times dist/ci/check.times --log dist/ci/check.log \
            --suite "$TITLE" --junit dist/ci/results/steps.xml --summary >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-rust-${{ matrix.key }}
          path: dist/ci/results/
          if-no-files-found: warn
          # A re-run of the job uploads the same name again; without this it fails.
          overwrite: true
          retention-days: 7

  dos:
    name: ${{ matrix.title }}
    needs: scope
    if: contains(needs.scope.outputs.groups, ',dos,')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: ghcr.io/liminal-hq/ci-dos@sha256:6b8c6308baaa4d05ee0f1af25512bece544ef79bbe653c31c7b5cab54ff52e2a
    strategy:
      fail-fast: false
      # Every part of the group (tools/check.sh --units) is in exactly one leg; a test checks it.
      matrix:
        include:
          - { key: main, groups: "dos:skeleton,dos:s1,dos:d0,dos:vga", title: "DOS: skeleton, s1-dxe3, d0-rust-dos, a-vga-vbe" }
          - { key: input, groups: "dos:input", title: "DOS: b-dos-input" }
    env:
      CHECK_GROUPS: ${{ matrix.groups }}
      TITLE: ${{ matrix.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # DJGPP, DOSBox Staging and CWSDPMI are under DOS_TOOLCHAIN in the image; setup links vendor/ to them and confirms each runs.
      - name: Set up the DOS toolchain
        run: tools/setup.sh
      - name: tools/check.sh --groups ${{ matrix.groups }}
        id: check
        run: |
          mkdir -p dist/ci
          CHECK_TIMES=dist/ci/check.times tools/check.sh --groups "$CHECK_GROUPS" 2>&1 | tee dist/ci/check.log
      # The step table for the job summary, and the JUnit that publish-test-results.yml posts on the pull request: one test case per step
      # of tools/check.sh (tools/steps-junit, built here from the checkout) and cargo-nextest's report of each workspace that ran
      # host tests. The nextest files are copied first, so a converter that fails to build does not lose them.
      - name: Step report
        if: always()
        run: |
          mkdir -p dist/ci/results
          for ws in hal shell module tools/steps-junit; do
            if [ -f "$ws/target/nextest/ci/junit.xml" ]; then cp "$ws/target/nextest/ci/junit.xml" "dist/ci/results/nextest-${ws//\//-}.xml"; fi
          done
          cargo build --release --locked --quiet --manifest-path tools/steps-junit/Cargo.toml
          tools/steps-junit/target/release/steps-junit --times dist/ci/check.times --log dist/ci/check.log \
            --suite "$TITLE" --junit dist/ci/results/steps.xml --summary >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-dos-${{ matrix.key }}
          path: dist/ci/results/
          if-no-files-found: warn
          # A re-run of the job uploads the same name again; without this it fails.
          overwrite: true
          retention-days: 7

  stdstubs:
    name: Spike e-std-stubs
    needs: scope
    if: contains(needs.scope.outputs.groups, ',stdstubs,')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: ghcr.io/liminal-hq/ci-dos@sha256:6b8c6308baaa4d05ee0f1af25512bece544ef79bbe653c31c7b5cab54ff52e2a
    env:
      CHECK_GROUPS: stdstubs
      TITLE: Spike e-std-stubs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Setup links vendor/ to the DOS tools in the image and confirms each runs.
      - name: Set up the DOS toolchain
        run: tools/setup.sh
      - name: tools/check.sh --groups stdstubs
        id: check
        run: |
          mkdir -p dist/ci
          CHECK_TIMES=dist/ci/check.times tools/check.sh --groups "$CHECK_GROUPS" 2>&1 | tee dist/ci/check.log
      # The step table for the job summary, and the JUnit that publish-test-results.yml posts on the pull request: one test case per step
      # of tools/check.sh (tools/steps-junit, built here from the checkout) and cargo-nextest's report of each workspace that ran
      # host tests. The nextest files are copied first, so a converter that fails to build does not lose them.
      - name: Step report
        if: always()
        run: |
          mkdir -p dist/ci/results
          for ws in hal shell module tools/steps-junit; do
            if [ -f "$ws/target/nextest/ci/junit.xml" ]; then cp "$ws/target/nextest/ci/junit.xml" "dist/ci/results/nextest-${ws//\//-}.xml"; fi
          done
          cargo build --release --locked --quiet --manifest-path tools/steps-junit/Cargo.toml
          tools/steps-junit/target/release/steps-junit --times dist/ci/check.times --log dist/ci/check.log \
            --suite "$TITLE" --junit dist/ci/results/steps.xml --summary >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-stdstubs
          path: dist/ci/results/
          if-no-files-found: warn
          # A re-run of the job uploads the same name again; without this it fails.
          overwrite: true
          retention-days: 7

  shelldos:
    name: Shell on DOS
    needs: scope
    if: contains(needs.scope.outputs.groups, ',shelldos,')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: ghcr.io/liminal-hq/ci-dos@sha256:6b8c6308baaa4d05ee0f1af25512bece544ef79bbe653c31c7b5cab54ff52e2a
    env:
      CHECK_GROUPS: shelldos
      TITLE: Shell on DOS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Setup links vendor/ to the DOS tools in the image and confirms each runs.
      - name: Set up the DOS toolchain
        run: tools/setup.sh
      - name: tools/check.sh --groups shelldos
        id: check
        run: |
          mkdir -p dist/ci
          CHECK_TIMES=dist/ci/check.times tools/check.sh --groups "$CHECK_GROUPS" 2>&1 | tee dist/ci/check.log
      # The comparison job reads the DOS read-back of the frame buffer and the DAC. One tar file, so the paths inside dist/ come back
      # exactly as they were, whatever the artefact action does with several paths.
      - name: Keep the DOS read-back for the comparison
        run: tar -cf dist/ci/frames-dos.tar dist/shell/dumps-8 dist/shell/dumps-4 dist/shell/dumps-vga
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frames-dos
          path: dist/ci/frames-dos.tar
          if-no-files-found: error
          # A re-run of the job uploads the same name again; without this it fails.
          overwrite: true
          retention-days: 3
      # The step table for the job summary, and the JUnit that publish-test-results.yml posts on the pull request: one test case per step
      # of tools/check.sh (tools/steps-junit, built here from the checkout) and cargo-nextest's report of each workspace that ran
      # host tests. The nextest files are copied first, so a converter that fails to build does not lose them.
      - name: Step report
        if: always()
        run: |
          mkdir -p dist/ci/results
          for ws in hal shell module tools/steps-junit; do
            if [ -f "$ws/target/nextest/ci/junit.xml" ]; then cp "$ws/target/nextest/ci/junit.xml" "dist/ci/results/nextest-${ws//\//-}.xml"; fi
          done
          cargo build --release --locked --quiet --manifest-path tools/steps-junit/Cargo.toml
          tools/steps-junit/target/release/steps-junit --times dist/ci/check.times --log dist/ci/check.log \
