# Posts the results of a finished CI run on its pull request: one comment, and a check run each for the check steps (a test case per step
# of tools/check.sh, from tools/steps-junit) and for the Rust host tests (cargo-nextest's JUnit), with liminal-hq-labs/pr-results.
#
# Split from ci.yml because a pull request's own GITHUB_TOKEN is read-only for fork and Dependabot pull requests, and publishing needs
# `checks: write` and `pull-requests: write`. A workflow_run workflow runs from the default branch with this file's permissions, whoever
# opened the pull request, and it never checks out or runs a pull request's code: it reads the run's results-* artefacts as data. So this
# file does nothing until it is on main, and a change to it takes effect only once it is merged. The settings are .github/pr-results.toml.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

name: Publish Test Results

on:
  # zizmor: ignore[dangerous-triggers] This is the publisher the design needs: it holds the write token but runs only the default
  # branch's code, reads the run's artefacts as untrusted data and never checks out a pull request.
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: pr-results-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish test results
    if: github.event.workflow_run.conclusion != 'skipped' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read # list and download the run's artefacts
      checks: write # create and update the check runs
      pull-requests: write # create and update the sticky comment
      contents: read # check out .github/ from the default branch (needed in private repositories)
    steps:
      # The default branch, and only its .github/ directory (the settings): no pull request code, and no credentials left behind.
      - name: Checkout the settings
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github
          persist-credentials: false
      # The action pins its binary by SHA-256 in the commit named here, and checks it before running it.
      - name: Publish the results
        uses: liminal-hq-labs/pr-results@8afc480363b3c8f09a4db221d1c4814415ab6eb2 # v0.1.0
        with:
          command: publish
